# openzoo-transmute hub — https://openzoo-sites.fly.dev/s/<programId>
app = "openzoo-sites"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENZOO_CLUSTER = "mainnet"
  OPENZOO_HUB_URL = "https://openzoo-sites.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/.hub/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
