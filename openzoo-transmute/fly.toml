# openzoo-transmute hub — https://sites.openzoo.fun/s/<programId>
app = "openzoo-sites"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENZOO_CLUSTER = "mainnet"
  OPENZOO_HUB_URL = "https://sites.openzoo.fun"
  PORT = "8080"
  # writes: set the secret OPENZOO_HUB_KEYPAIR (JSON byte array) to let visitors POST; bounded by these
  OPENZOO_HUB_WRITE_BUDGET_SOL = "0.05"
  OPENZOO_HUB_WRITES_PER_MIN = "3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/.hub/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
