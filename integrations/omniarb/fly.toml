# fly deploy, from integrations/omniarb.
#
# No secrets belong here beyond BIRDEYE_KEY (set it with `fly secrets set`, not
# in this file). Nothing in the image signs: the visitor's wallet does.
app = "omniarb-desk"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine always warm: the first request after a cold start pays for every
  # RPC handshake at once, and the board is the first thing anyone sees.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/me"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
